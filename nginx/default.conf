server {
 listen 80;
 server_name go.metix.ai go-dev.metix.ai;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://outreach.openjobs-ai.com https://media.licdn.com https://media-exp1.licdn.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
 location = / { return 302 /recruiters-view/$is_args$args; }
 location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
 location ~ ^/unsubcribe/?$ { return 302 /unsubscribe$is_args$args; }
 include /etc/nginx/campaign-upstreams.conf;
 location ^~ /share/ {
  proxy_pass http://127.0.0.1:4321;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 15s;
 }
 location ^~ /show/ {
  proxy_pass http://127.0.0.1:4321;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 15s;
 }
 location = /recruiters-view { return 308 /recruiters-view/$is_args$args; }
 location = /recruiters-view/ {
  proxy_pass http://127.0.0.1:4321;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 15s;
 }
 location = /recruiters-view/share {
  proxy_pass http://127.0.0.1:4321;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 15s;
 }
 location = /recruiters-view/share/ { return 308 /recruiters-view/share$is_args$args; }
 location ^~ /_astro/ { expires 1y; try_files $uri =404; }
 location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ { expires 1h; try_files $uri =404; }
 error_page 404 /404.html;
 location = /404.html { internal; }
 location / { expires -1; try_files $uri $uri/index.html =404; }
}
