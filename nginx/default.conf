server {
 listen 80;
 server_name go.metix.ai;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clarity.ms https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.clarity.ms https://c.bing.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://media.licdn.com https://media-exp1.licdn.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
 location = / { return 302 /recruiters-view/$is_args$args; }
 location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
 include /etc/nginx/campaign-upstreams.conf;
 location ^~ /_astro/ { expires 1y; try_files $uri =404; }
 location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ { expires 1h; try_files $uri =404; }
 error_page 404 /404.html;
 location = /404.html { internal; }
 location / { expires -1; try_files $uri $uri/index.html =404; }
}
